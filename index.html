<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VENNNNNN 😏</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    font-family: "Segoe UI", system-ui, sans-serif; color: #5a1030;
    overflow: hidden; text-align: center;
  }
  .card {
    background: rgba(255,255,255,.75); backdrop-filter: blur(8px);
    padding: 2.5rem 2rem; border-radius: 24px; max-width: 420px; width: 90%;
    box-shadow: 0 20px 50px rgba(150,30,80,.25); position: relative; z-index: 2;
  }
  h1 { margin: 0 0 .5rem; font-size: 2rem; }
  p { margin: .5rem 0 1.5rem; font-size: 1.1rem; }
  .emoji { font-size: 3.5rem; animation: bob 1.5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(8deg); } }
  button {
    border: none; border-radius: 999px; padding: .8rem 1.8rem; font-size: 1.1rem;
    cursor: pointer; transition: transform .15s;
  }
  #yes { background: #ff4d79; color: #fff; }
  #yes:hover { transform: scale(1.12); }
  #no { background: #eee; color: #555; margin-left: .8rem; position: relative; }
  .heart { position: fixed; bottom: -40px; animation: rise linear forwards; z-index: 1; }
  @keyframes rise { to { transform: translateY(-110vh) rotate(40deg); opacity: 0; } }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card" id="ask">
    <div class="emoji">😘</div>
    <h1>Okay, I'll be honest…</h1>
    <p>I made a whole website just to ask you a question<br>
       Crush mo nanaman ako no?</p>
    <button id="yes">Yes 💖</button>
    <button id="no">No 🙄</button>
  </div>

  <div class="card hidden" id="win">
    <div class="emoji">🥰</div>
    <h1>I knew you had taste 😌</h1>
    <p>May mwaps ka sakin nyahahahaha</p>
  </div>

<script>
  const no = document.getElementById('no');
  const yes = document.getElementById('yes');
  const lines = ["Are you sure? 🥺", "Think again 😏", "Wrong button, cutie",
                 "I'll wait… 😌", "Nice try 😂", "Just say yes already 💕"];
  let i = 0;

  function dodge() {
    no.style.position = 'fixed';
    no.style.left = Math.random() * (innerWidth - no.offsetWidth) + 'px';
    no.style.top = Math.random() * (innerHeight - no.offsetHeight) + 'px';
    no.textContent = lines[i++ % lines.length];
    yes.style.transform = 'scale(' + Math.min(1 + i * 0.1, 1.8) + ')';
  }
  no.addEventListener('mouseover', dodge);
  no.addEventListener('touchstart', e => { e.preventDefault(); dodge(); });
  no.addEventListener('click', dodge);

  function hearts() {
    for (let n = 0; n < 40; n++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = ['💖','💘','💕','😘'][Math.floor(Math.random()*4)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = 20 + Math.random() * 30 + 'px';
      h.style.animationDuration = 3 + Math.random() * 3 + 's';
      h.style.animationDelay = Math.random() * 1.5 + 's';
      document.body.appendChild(h);
    }
  }

  yes.addEventListener('click', () => {
    document.getElementById('ask').classList.add('hidden');
    no.classList.add('hidden');
    document.getElementById('win').classList.remove('hidden');
    hearts();
  });
</script>
</body>
</html>
